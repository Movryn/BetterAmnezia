name: release

# Pull requests: build every architecture on Windows and attach the results
# as workflow artifacts. Pushes to master (and manual runs): additionally
# publish a GitHub release for version/version.go if it is not released yet.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build programs
        shell: cmd
        run: build.bat

      - name: build installers
        shell: cmd
        run: installer\build.bat

      - name: package
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path version\version.go -Pattern 'Number\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "amd64", "x86", "arm64") {
            $stage = "stage\BetterAmnezia-$version-$arch"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "$arch\betteramnezia.exe", "$arch\wintun.dll", README.md, COPYING $stage
            Compress-Archive -Path "$stage\*" -DestinationPath "dist\BetterAmnezia-$version-$arch-portable.zip"
          }
          Copy-Item installer\dist\*.msi dist\
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist\SHA256SUMS.txt
          Get-ChildItem dist

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: BetterAmnezia-${{ steps.package.outputs.version }}
          path: dist/*
          retention-days: 30

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check whether this version is released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ needs.build.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ needs.build.outputs.version }} already exists; bump version/version.go to release again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: download
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: BetterAmnezia-${{ needs.build.outputs.version }}
          path: dist

      - name: publish
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BetterAmnezia ${{ needs.build.outputs.version }}
          body_path: .github/release-notes.md
          files: dist/*

name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: unit tests
        run: go test -race ./splittunnel ./extras ./importer ./ghupdate

      - name: build for windows
        run: |
          for arch in amd64 386 arm64; do
            GOOS=windows GOARCH=$arch go build -o /dev/null . || exit 1
          done

      - name: vet new packages
        run: GOOS=windows go vet ./splittunnel ./extras ./importer ./tunnel/firewall

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: interface flows
        run: node webui/dev/flows.test.js
